<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>台データ記録 | Slot Data Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
:root{
  --bg:#15171c; --panel:#1e2128; --panel2:#252932; --line:#343a46;
  --text:#e8eaef; --sub:#9aa1ae; --accent:#ff8a2a; --accent-dim:#b35f1d;
  --bb:#ff5d5d; --rb:#5da2ff; --good:#4fd18b; --bad:#ff6b6b;
  --mono:"SF Mono","Consolas","Menlo",monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:14px;padding-bottom:70px}
#root{max-width:760px;margin:0 auto}
.header{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:10px}
.header h1{font-size:17px;font-weight:700;letter-spacing:.04em}
.header h1 .seg{color:var(--accent)}
.header .sub{font-size:11px;color:var(--sub)}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);display:flex;z-index:50;max-width:760px;margin:0 auto}
.tabbar button{flex:1;background:none;border:none;color:var(--sub);padding:10px 0 max(10px,env(safe-area-inset-bottom));font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.tabbar button.on{color:var(--accent);font-weight:700}
.tabbar .ic{font-size:17px;line-height:1}
.page{padding:14px 14px 20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.card h2{font-size:13px;color:var(--accent);margin-bottom:10px;letter-spacing:.05em}
label.fl{display:block;font-size:11px;color:var(--sub);margin:8px 0 4px}
input[type=text],input[type=date],select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:7px;color:var(--text);padding:9px 10px;font-size:14px}
textarea{font-family:var(--mono);font-size:11px;min-height:110px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
.btn{background:var(--accent);color:#1a1206;border:none;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;width:100%}
.btn:disabled{background:#3a3f4a;color:#777}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent-dim)}
.btn.small{width:auto;padding:6px 12px;font-size:12px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid #5a3030}
.row2{display:flex;gap:8px}
.row2>*{flex:1}
.msg{font-size:12px;border-radius:7px;padding:8px 10px;margin-top:8px}
.msg.ok{background:#12301f;color:var(--good)}
.msg.err{background:#331b1b;color:var(--bad)}
.msg.info{background:#20242c;color:var(--sub)}
table.dt{width:100%;border-collapse:collapse;font-size:12px}
table.dt th{color:var(--sub);font-weight:500;font-size:10px;text-align:right;padding:5px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.dt td{text-align:right;padding:6px;border-bottom:1px solid #262a33;font-family:var(--mono);font-size:12px;white-space:nowrap}
table.dt th:first-child,table.dt td:first-child{text-align:left}
.daichip{display:inline-block;border:1.5px solid var(--accent);color:var(--accent);border-radius:6px;padding:1px 7px;font-family:var(--mono);font-weight:700;font-size:12px;cursor:pointer}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
.pill{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:11px;color:var(--sub);margin:0 6px 6px 0;cursor:pointer}
.pill.on{border-color:var(--accent);color:var(--accent)}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--panel2);border-radius:8px;padding:8px}
.stat .v{font-family:var(--mono);font-size:16px;font-weight:700}
.stat .k{font-size:10px;color:var(--sub);margin-top:2px}
.legend{display:flex;gap:12px;font-size:11px;color:var(--sub);margin:4px 0 6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
.note{font-size:11px;color:var(--sub);line-height:1.6}
.codebox{background:#111318;border:1px solid var(--line);border-radius:8px;padding:10px;font-family:var(--mono);font-size:10px;word-break:break-all;max-height:130px;overflow:auto;color:#c8cdd8}
.gCol{color:var(--good)} .bCol{color:var(--bad)}
tr.hot td{background:rgba(79,209,139,.08)}
table.mx{border-collapse:collapse;font-size:10px}
table.mx th,table.mx td{padding:4px 5px;text-align:center;border:1px solid #262a33;font-family:var(--mono);white-space:nowrap}
table.mx th{color:var(--sub);font-weight:500;background:var(--panel)}
table.mx th.dcol,table.mx td.dcol{position:sticky;left:0;background:var(--panel);z-index:2;color:var(--sub)}
table.mx td.hotc{color:var(--good);font-weight:700;background:rgba(79,209,139,.12)}
table.mx td.dot{color:#4a505c}
.star56{color:var(--good);font-weight:700;margin-left:3px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
.rcell{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 4px;text-align:center;cursor:pointer;user-select:none}
.rcell .no{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent)}
.rcell .cd{font-family:var(--mono);font-size:15px;letter-spacing:.06em;margin-top:2px}
.rcell .cd.empty{color:#4a505c}
.rcell.chg{border-color:var(--bad);background:rgba(255,107,107,.14)}
.rcell.chg .no{color:var(--bad)}
.rcell.unk{border-color:#5a6070;background:rgba(120,130,150,.12)}
.rcell.unk .cd{color:#7c8494}
.rcell .tag{font-size:9px;margin-top:2px}
.rcell.chg .tag{color:var(--bad)} .rcell.unk .tag{color:#8b93a1}
.rcell.keep{border-color:var(--good);background:rgba(79,209,139,.10)}
.rcell.gak{border-color:#f0b429;background:rgba(240,180,41,.16)}
.rcell.gak .no{color:#f0b429}
.rcell.gak .tag{color:#f0b429}
.rcell.editmode{border-style:dashed}
.rcell.editmode .no{color:var(--bad)}
.rcell .rmx{position:absolute;top:2px;right:4px;font-size:10px;color:var(--bad)}
.rcell{position:relative}
.bigbtn{display:flex;gap:8px;margin:10px 0}
.bigbtn button{flex:1;border:none;border-radius:10px;padding:16px 0;font-size:17px;font-weight:800;cursor:pointer}
.bigbtn .bBB{background:var(--bb);color:#2a0d0d}
.bigbtn .bRB{background:var(--rb);color:#0b1c33}
.hitrow{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid #262a33;font-size:12px}
.hitrow .g{font-family:var(--mono);font-size:13px;min-width:58px;text-align:right}
.badge{border-radius:5px;padding:1px 7px;font-size:11px;font-weight:700}
.badge.bb{background:rgba(255,93,93,.2);color:var(--bb)}
.badge.rb{background:rgba(93,162,255,.2);color:var(--rb)}
.kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kbtn{border:none;border-radius:12px;padding:10px 2px 8px;text-align:center;cursor:pointer;user-select:none}
.kbtn .kn{font-size:26px;font-weight:800;line-height:1.1;font-family:var(--mono)}
.kbtn .kp{font-size:10px;opacity:.75;font-family:var(--mono)}
.kbtn .kl{font-size:11px;font-weight:700;margin-top:2px}
.kminus{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.kminus button{background:transparent;border:1px solid var(--line);color:var(--sub);border-radius:8px;padding:5px 0;font-size:12px;cursor:pointer}
.kten{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.kten button{border-radius:11px;padding:16px 0;font-size:19px;font-weight:800;cursor:pointer;border:2px solid transparent;transform:scale(1);transition:transform .08s,box-shadow .15s,border-color .15s}
.kten button.flash{transform:scale(1.06);box-shadow:0 0 0 3px var(--kflash,rgba(255,255,255,.5));border-color:var(--kflash,#fff)}
.kbtn{transition:box-shadow .15s,border-color .15s}
.kbtn.flash{box-shadow:0 0 0 3px var(--kflash,rgba(255,255,255,.5))}
.rcell.keep .tag{color:var(--good)}
ol.steps{padding-left:18px;font-size:12px;color:var(--text);line-height:1.9}
.previewWrap{border:1px dashed var(--accent-dim);border-radius:8px;padding:8px;margin-top:10px}
.mut{color:var(--sub)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useMemo,useRef} = React;
const LS_KEY = "slotTracker_v1";

/* ---------- storage ---------- */
function loadDB(){ try{ const d=JSON.parse(localStorage.getItem(LS_KEY)); if(d&&Array.isArray(d.records)) return {reels:{},hits:{},...d}; }catch(e){} return {records:[],reels:{},hits:{}}; }
function saveDB(db){ try{ localStorage.setItem(LS_KEY, JSON.stringify(db)); return true; }catch(e){ return false; } }

/* ---------- number utils ---------- */
const num = s => { if(s==null) return null; const t=String(s).replace(/[,回枚\s]/g,"").replace(/^1\//,""); if(t===""||t==="-") return null; const v=parseFloat(t); return isNaN(v)?null:v; };
function ymdLocal(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function normDate(v){
  if(v==null) return null;
  let t=String(v).trim().replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
  t=t.replace(/[年月]/g,"-").replace(/日/g,"").replace(/[\/\.]/g,"-").trim();
  let m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return m[1]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[3]).padStart(2,"0");
  m=t.match(/^(\d{4})(\d{2})(\d{2})$/);
  if(m) return m[1]+"-"+m[2]+"-"+m[3];
  return null;
}
const fmt = (v,d=0) => v==null?"–":v.toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});

/* ---------- parser ---------- */
const COLMAP = [
  {key:"dai",   re:/台番号|台番/},
  {key:"start", re:/累計スタート|累計|総回転|総ゲーム|総スタート/},
  {key:"bb",    re:/BB/i},
  {key:"rb",    re:/RB/i},
  {key:"gousei",re:/合成/},
  {key:"maxDama",re:/最大持/},
  {key:"prevStart",re:/前日/},
  {key:"dayStart",re:/スタート回数|^スタート/},
];
function mapHeader(cells){
  const used=new Set();
  return cells.map(h=>{
    for(const c of COLMAP){ if(!used.has(c.key)&&c.re.test(h)){ used.add(c.key); return c.key; } }
    return null;
  });
}
function addDays(iso,delta){ const d=new Date(iso+"T00:00:00"); d.setDate(d.getDate()+delta); return ymdLocal(d); }
function parseBookmarkletJSON(obj){
  const tables=(obj.tables||[]).filter(t=>t.length>1);
  if(!tables.length) throw "テーブルが見つかりません";
  const pageDate=(obj.date&&/^\d{4}-\d{2}-\d{2}$/.test(obj.date))?obj.date:null;
  let model=null;
  if(obj.title){ const m=obj.title.split(/[|｜\-–【】]/).map(x=>x.trim()).filter(Boolean)[0]; if(m&&m.length<=30&&!/大当|データ|情報/.test(m)) model=m; }

  // --- P's CUBE 台別詳細(直接アクセス版): 2列ラベル/値の表が日別に並ぶ ---
  {
    const isDayTable=t=>{
      const two=t.filter(r=>r.length===2).length>=t.length-1;
      const ls=t.map(r=>(r[0]||"").trim());
      return two&&ls.includes("BIG")&&ls.includes("REG");
    };
    const dayTables=tables.filter(isDayTable);
    if(dayTables.length){
      if(!pageDate) throw "ページから日付を取得できませんでした";
      const dai=obj.dai?parseInt(obj.dai):null;
      if(!dai) throw "台番号を取得できませんでした。ブックマークレットを最新版に更新してください";
      const rows=[];
      dayTables.forEach((t,idx)=>{
        const get=re=>{ const r=t.find(r=>re.test((r[0]||"").trim())); return r?num(r[1]):null; };
        const bb=get(/^BIG$/), rb=get(/^REG$/), bonus=get(/^BONUS$/);
        const gousei=get(/合成/), maxDama=get(/最大放出|最大持/);
        if(bb==null&&rb==null&&bonus==null) return;
        rows.push({dai,date:addDays(pageDate,-idx),bb,rb,bonus:(bonus!=null?bonus:((bb||0)+(rb||0))||null),gousei,maxDama,model});
      });
      if(rows.length) return {rows,date:pageDate,model,url:obj.url||null,fmt:"pscube-direct"};
    }
  }

  // --- P's CUBE 台別詳細: 転置表 (行=BONUS/BIG/REG/合成確率..., 列=本日/N日前) ---
  for(const t of tables){
    const labels=t.map(r=>(r[0]||"").trim());
    if(!(labels.includes("BIG")&&labels.includes("REG"))) continue;
    const hIdx=t.findIndex(r=>r.some(c=>/本日|日前/.test(c)));
    if(hIdx<0) continue;
    if(!pageDate) throw "ページから日付を取得できませんでした";
    const dai=obj.dai?parseInt(obj.dai):null;
    if(!dai) throw "台番号を取得できませんでした。ブックマークレットを最新版に更新してください";
    const header=t[hIdx];
    const offs=header.map(h=>{ if(/本日/.test(h)) return 0; const m=h.match(/(\d+)\s*日前/); return m?parseInt(m[1]):null; });
    const rowOf=re=>t.find(r=>re.test((r[0]||"").trim()));
    const rBonus=rowOf(/^BONUS$/), rBig=rowOf(/^BIG$/), rReg=rowOf(/^REG$/), rGousei=rowOf(/合成/), rMax=rowOf(/最大放出|最大持/);
    const rows=[];
    offs.forEach((off,j)=>{
      if(off==null) return;
      const bb=rBig?num(rBig[j]):null, rb=rReg?num(rReg[j]):null;
      const bonus=rBonus?num(rBonus[j]):null, gousei=rGousei?num(rGousei[j]):null;
      const maxDama=rMax?num(rMax[j]):null;
      if(bb==null&&rb==null&&bonus==null) return;
      const start=(gousei&&((bb||0)+(rb||0))>0)?Math.round(gousei*((bb||0)+(rb||0))):null;
      rows.push({dai,date:addDays(pageDate,-off),bb,rb,bonus,gousei,maxDama,start,model});
    });
    if(rows.length) return {rows,date:pageDate,model,url:obj.url||null,fmt:"pscube-detail"};
  }

  // --- P's CUBE style: header has 本日 / N日前 (BONUS) ---
  for(const t of tables){
    const hIdx=t.findIndex(r=>r.some(c=>/本日/.test(c))&&r.some(c=>/日前/.test(c)));
    if(hIdx<0) continue;
    const header=t[hIdx];
    const offs=header.map(h=>{ if(/本日/.test(h)) return 0; const m=h.match(/(\d+)\s*日前/); return m?parseInt(m[1]):null; });
    if(!pageDate) throw "ページから日付を取得できませんでした";
    const rows=[]; let curModel=model;
    for(let i=0;i<t.length;i++){
      if(i===hIdx) continue;
      const r=t[i];
      const joined=r.filter(Boolean).join(" ");
      const daiCell=r.find(c=>/^\d{2,4}$/.test(c));
      if(!daiCell){
        if(joined&&joined.length<=30&&!/本日|日前|台番|クリック|検索/.test(joined)) curModel=joined;
        continue;
      }
      const dai=parseInt(daiCell);
      r.forEach((c,j)=>{
        if(offs[j]==null) return;
        const v=num(c); if(v==null) return;
        rows.push({dai,bonus:v,date:addDays(pageDate,-offs[j]),model:curModel});
      });
    }
    if(rows.length) return {rows,date:pageDate,model,url:obj.url||null,fmt:"pscube"};
  }

  // --- DATA ONLINE style ---
  let best=null,bestScore=-1;
  for(const t of tables){
    let hIdx=t.findIndex(r=>r.some(c=>/台番/.test(c)));
    if(hIdx<0) hIdx=0;
    const keys=mapHeader(t[hIdx]);
    const score=keys.filter(Boolean).length*1000+t.length;
    if(score>bestScore){bestScore=score;best={t,hIdx,keys};}
  }
  const {t,hIdx,keys}=best;
  const rows=[];
  for(let i=hIdx+1;i<t.length;i++){
    const r=t[i]; const rec={};
    keys.forEach((k,j)=>{ if(k) rec[k]=num(r[j]); });
    if(rec.dai!=null) rows.push(rec);
  }
  if(!rows.length) throw "台データ行が見つかりません(リスト表示でお試しください)";
  return {rows,date:pageDate,model,url:obj.url||null,fmt:"dataonline"};
}
function parsePlainText(text){
  // fallback: lines of numbers, first = 台番号 (3-4 digits)
  const rows=[];
  text.split(/\n+/).forEach(line=>{
    const cells=line.trim().split(/[\t,]+|\s{1,}/).map(c=>c.trim()).filter(Boolean);
    if(cells.length>=3 && /^\d{2,4}$/.test(cells[0])){
      rows.push({dai:num(cells[0]),start:num(cells[1]),bb:num(cells[2]),rb:num(cells[3]),gousei:num(cells[4]),maxDama:num(cells[5]),prevStart:num(cells[6])});
    }
  });
  if(!rows.length) throw "解析できませんでした";
  return {rows,date:null,model:null,url:null};
}
function parseInput(text){
  const t=text.trim();
  if(!t) throw "貼り付け内容が空です";
  if(t.startsWith("{")){ return parseBookmarkletJSON(JSON.parse(t)); }
  return parsePlainText(t);
}

/* ---------- bookmarklet source ---------- */
const BM_SRC = `javascript:(function(){function x(e){return(e.innerText||'').trim().replace(/\\s+/g,' ');}var T=[].slice.call(document.querySelectorAll('table')).map(function(t){return [].slice.call(t.rows).map(function(r){return [].slice.call(r.cells).map(x);});}).filter(function(r){return r.length>1;});var has=T.some(function(t){return t.length>2&&t.some(function(r){return r.some(function(c){return /^\\d{2,4}$/.test(c);});});});if(!has){var f=[].slice.call(document.querySelectorAll('iframe')).map(function(i){return i.src;}).filter(function(s){return s&&s.indexOf('http')===0&&s.indexOf('dmm.com')<0;});if(f.length){if(confirm('台データの表が見つかりません。埋め込みデータページへ移動しますか？（移動後にもう一度実行してください）')){location.href=f[0];}return;}alert('台データの表が見つかりません。リスト表示/DATA表示のページでお試しください');return;}var d=(document.body.innerText.match(/\\d{4}[-\\/]\\d{2}[-\\/]\\d{2}/)||[''])[0].replace(/\\//g,'-');var dn=(document.body.innerText.match(/台番号\\s*([0-9]{2,4})/)||['',''])[1];var s=JSON.stringify({date:d,dai:dn,url:location.href,title:document.title,tables:T});function fb(){var a=document.createElement('textarea');a.value=s;a.style.cssText='position:fixed;top:8%;left:4%;width:92%;height:55%;z-index:999999;background:white;color:black;border:3px solid rgb(255,138,42);border-radius:8px;padding:8px;font-size:11px';document.body.appendChild(a);a.focus();a.select();alert('全選択済みです。コピーして記録アプリに貼り付けてください');}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).then(function(){alert('台データをコピーしました。記録アプリに貼り付けてください');},fb);}else{fb();}})();`;

/* ---------- 差枚推定 (マイジャグV 設定1ベース) ---------- */
const COIN={ budou:5.98, replay:7.3, cherry:38.1, pBudou:8, pCherry:2, bb:240, rb:96 };
function estDiff(r,cfg){
  const c=cfg||COIN;
  const G=r.start; if(!G||G<=0) return null;
  const replay=G/c.replay, budou=G/c.budou, cherry=G/c.cherry;
  const IN=(G-replay)*3;
  const OUT=(r.bb||0)*c.bb+(r.rb||0)*c.rb+budou*c.pBudou+cherry*c.pCherry;
  return Math.round(OUT-IN);
}
/* ---------- 機種プロファイル（設定判別用） ---------- */
const MACHINE_PROFILES={
  "マイジャグラーV":{
    bb:[273.1,269.7,269.7,259.0,254.9,240.9],
    rb:[439.8,399.6,331.0,315.1,255.0,229.1],
    budou:[5.98,5.88,5.84,5.81,5.76,5.65],
  },
  "アイムジャグラーEX":{
    bb:[273.1,269.7,269.7,259.0,259.0,255.0],
    rb:[439.8,399.6,331.0,315.1,255.0,255.0],
    budou:[6.02,6.02,6.02,6.02,6.02,5.78],
  },
  "ネオアイムジャグラーEX":{
    bb:[273.1,269.7,269.7,259.0,259.0,255.0],

    budou:[5.93,5.93,5.93,5.93,5.87,5.81],

};
function guessProfile(model){
  if(!model) return null;
  const m=model.replace(/\s/g,"");
  const hit=Object.keys(MACHINE_PROFILES).find(k=>m.includes(k.replace(/\s/g,""))||k.replace(/\s/g,"").includes(m));
  return hit?MACHINE_PROFILES[hit]:null;
}
// 二項尤度によるベイズ事後確率
function settingPosterior(profile,obs){
  // obs: {bb:{n,N}, rb:{n,N}, budou:{n,N}}  n=回数, N=試行回数(母数)
  const logBinomLikelihood=(n,N,p)=>{
    if(N<=0) return 0;
    if(p<=0||p>=1) return -Infinity;
    return n*Math.log(p)+(N-n)*Math.log(1-p); // C(N,n)は全設定共通なので省略
  };
  const settings=[0,1,2,3,4,5]; // index → 設定1-6
  const logs=settings.map(i=>{
    let L=0;
    if(profile.bb&&obs.bb&&obs.bb.N>0) L+=logBinomLikelihood(obs.bb.n,obs.bb.N,1/profile.bb[i]);
    if(profile.rb&&obs.rb&&obs.rb.N>0) L+=logBinomLikelihood(obs.rb.n,obs.rb.N,1/profile.rb[i]);
    if(profile.budou&&obs.budou&&obs.budou.N>0) L+=logBinomLikelihood(obs.budou.n,obs.budou.N,1/profile.budou[i]);
    return L;
  });
  const maxL=Math.max(...logs.filter(x=>isFinite(x)));
  const exps=logs.map(L=>isFinite(L)?Math.exp(L-maxL):0);
  const sum=exps.reduce((a,b)=>a+b,0);
  if(sum<=0) return settings.map(()=>1/6);
  return exps.map(e=>e/sum);
}
/* ---------- ブドウ逆算 ---------- */
const BUDOU_TABLE=[[1,5.98],[2,5.88],[3,5.84],[4,5.81],[5,5.76],[6,5.65]];
function calcBudou({G,bb,rb,diff,cherryOn}){
  if(!G||G<=0) return null;
  const c=COIN;
  const replay=G/c.replay;
  const IN=(G-replay)*3;
  const cherryPay=cherryOn?(G/c.cherry)*c.pCherry:0;
  // diff = bb*240 + rb*96 + budou*8 + cherryPay - IN  →  budou を解く
  const budou=(diff+IN-(bb||0)*c.bb-(rb||0)*c.rb-cherryPay)/c.pBudou;
  if(!(budou>0)) return null;
  const prob=G/budou;
  let best=BUDOU_TABLE[0];
  BUDOU_TABLE.forEach(t=>{ if(Math.abs(t[1]-prob)<Math.abs(best[1]-prob)) best=t; });
  return {budou:Math.round(budou),prob,nearest:best[0],table:BUDOU_TABLE};
}
/* ---------- derived helpers ---------- */
function hotCheck(r,thRbP,minStart,thRbCnt,thDama){
  if(r.rbP!=null&&(r.start||0)>=minStart&&r.rbP<=thRbP+0.5) return "prob";   // バケ確率基準(端数0.5許容)
  if((r.start==null||r.start===0)&&r.rb!=null&&r.rb>=thRbCnt) return "count"; // 回転数なし店: RB回数基準
  if(r.rbP==null&&(r.rb==null||r.rb===0)&&r.maxDama!=null&&thDama&&r.maxDama>=thDama) return "dama"; // AT機: 出玉基準
  return null;
}
// △: 惜しい台（母数不足だがバケ優秀 / しきい値をわずかに超過）
function warmCheck(r,thRbP,minStart,thRbCnt,thDama){
  if(hotCheck(r,thRbP,minStart,thRbCnt,thDama)) return null;
  if(r.rbP==null&&(r.rb==null||r.rb===0)&&r.maxDama!=null&&thDama) return r.maxDama>=thDama*0.75?"dama":null;
  if(r.rbP==null) return null;
  if(r.rbP<=thRbP+0.5&&(r.start||0)>=minStart*0.4) return "few";   // G数不足だがバケ良好
  if((r.start||0)>=minStart&&r.rbP<=thRbP*1.12) return "near";     // 母数十分でわずかに超過
  return null;
}
function withDerived(r){
  const total=(r.bb!=null||r.rb!=null)?(r.bb||0)+(r.rb||0):(r.bonus!=null?r.bonus:0);
  let start=r.start, startEst=false;
  if((start==null||start===0)&&r.gousei&&total>0){ start=Math.round(r.gousei*total); startEst=true; }
  const gousei = r.gousei!=null ? r.gousei : (start&&total? start/total : null);
  const bbP = start&&r.bb? start/r.bb : null;
  const rbP = start&&r.rb? start/r.rb : null;
  return {...r,total,start,startEst,gouseiD:gousei,bbP,rbP};
}

/* ---------- SVG charts ---------- */
function LineChart({data,w=340,h=140,color="#ff8a2a",yLabel,invertGood,zeroLine}){
  if(!data.length) return <div className="note">データなし</div>;
  const pad={l:38,r:8,t:8,b:20};
  const xs=data.map((_,i)=>i);
  const ys=data.map(d=>d.y).filter(v=>v!=null);
  if(!ys.length) return <div className="note">データなし</div>;
  let ymin=Math.min(...ys),ymax=Math.max(...ys);
  if(ymin===ymax){ymin-=1;ymax+=1;}
  const X=i=>pad.l+(w-pad.l-pad.r)*(xs.length===1?0.5:i/(xs.length-1));
  const Y=v=>pad.t+(h-pad.t-pad.b)*(1-(v-ymin)/(ymax-ymin));
  const pts=data.map((d,i)=>d.y==null?null:`${X(i)},${Y(d.y)}`).filter(Boolean).join(" ");
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{width:"100%",height:"auto"}}>
      {[ymin,(ymin+ymax)/2,ymax].map((v,i)=>(
        <g key={i}>
          <line x1={pad.l} x2={w-pad.r} y1={Y(v)} y2={Y(v)} stroke="#2b3038" strokeWidth="1"/>
          <text x={pad.l-4} y={Y(v)+3} textAnchor="end" fontSize="9" fill="#8b93a1" fontFamily="monospace">{fmt(v,v<10?1:0)}</text>
        </g>
      ))}
      {zeroLine&&ymin<0&&ymax>0&&<line x1={pad.l} x2={w-pad.r} y1={Y(0)} y2={Y(0)} stroke="#6b7280" strokeWidth="1" strokeDasharray="3 3"/>}
      <polyline points={pts} fill="none" stroke={color} strokeWidth="2"/>
      {data.map((d,i)=>d.y==null?null:<circle key={i} cx={X(i)} cy={Y(d.y)} r="3" fill={color}/>)}
      {data.map((d,i)=>(
        <text key={"x"+i} x={X(i)} y={h-6} textAnchor="middle" fontSize="8" fill="#8b93a1" fontFamily="monospace">
          {data.length<=8||i%Math.ceil(data.length/6)===0?d.x.slice(5):""}
        </text>
      ))}
      {yLabel&&<text x={4} y={12} fontSize="9" fill="#8b93a1">{yLabel}{invertGood?" (低いほど良)":""}</text>}
    </svg>
  );
}
function StackBars({data,w=340,h=140}){
  if(!data.length) return <div className="note">データなし</div>;
  const pad={l:30,r:8,t:8,b:20};
  const max=Math.max(...data.map(d=>(d.bb||0)+(d.rb||0)),1);
  const bw=Math.min(30,(w-pad.l-pad.r)/data.length*0.65);
  const X=i=>pad.l+(w-pad.l-pad.r)*((i+0.5)/data.length);
  const H=v=>(h-pad.t-pad.b)*v/max;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{width:"100%",height:"auto"}}>
      {[0,max/2,max].map((v,i)=>(
        <g key={i}>
          <line x1={pad.l} x2={w-pad.r} y1={h-pad.b-H(v)} y2={h-pad.b-H(v)} stroke="#2b3038"/>
          <text x={pad.l-4} y={h-pad.b-H(v)+3} textAnchor="end" fontSize="9" fill="#8b93a1" fontFamily="monospace">{fmt(v)}</text>
        </g>
      ))}
      {data.map((d,i)=>{
        const hb=H(d.bb||0),hr=H(d.rb||0);
        return (<g key={i}>
          <rect x={X(i)-bw/2} y={h-pad.b-hb} width={bw} height={hb} fill="var(--bb)" rx="2"/>
          <rect x={X(i)-bw/2} y={h-pad.b-hb-hr} width={bw} height={hr} fill="var(--rb)" rx="2"/>
          <text x={X(i)} y={h-6} textAnchor="middle" fontSize="8" fill="#8b93a1" fontFamily="monospace">
            {data.length<=8||i%Math.ceil(data.length/6)===0?String(d.x).slice(-5):""}
          </text>
        </g>);
      })}
    </svg>
  );
}

          <h2>台 {dai} の履歴 <span className="mut">({hist.length}日分)</span></h2>
          <div className="legend"><span><i style={{background:"var(--bb)"}}/>BB(BB/RB区別なしの店は当り計)</span><span><i style={{background:"var(--rb)"}}/>RB</span></div>
          <StackBars data={hist.map(h=>({x:h.date,bb:h.bb!=null?h.bb:h.bonus,rb:h.rb}))}/>
          <div style={{marginTop:10}}>
            <div className="legend" style={{justifyContent:"space-between",alignItems:"center"}}>
              <span>差枚推移（設定1ベース推定）</span>
              <span>
                <span className={"pill"+(diffMode==="daily"?" on":"")} onClick={()=>setDiffMode("daily")}>日別</span>
                <span className={"pill"+(diffMode==="cum"?" on":"")} onClick={()=>setDiffMode("cum")}>累積</span>
              </span>
            </div>
            <LineChart data={diffSeries} yLabel={diffMode==="cum"?"累積差枚(推定)":"日別差枚(推定)"} color="#4fd18b" zeroLine/>
            <div className="note" style={{marginTop:4}}>推定式:(BB×240＋RB×96＋ブドウ×8＋チェリー×2)−(総回転−リプレイ)×3。設定1の小役確率(ブドウ1/5.98・リプレイ1/7.3・チェリー1/38.1)で計算しているため、実際の小役の引きにより誤差があります。</div>
          </div>
          <div className="scrollx" style={{marginTop:8}}><table className="dt">
            <thead><tr><th>日付</th><th>累計S</th><th>BB</th><th>RB</th><th>差枚(推定)</th><th>RB確率</th><th style={{textAlign:"left"}}>推定・メモ</th></tr></thead>
            <tbody>{hist.map((h,i)=>(
              <tr key={i}><td>{h.date.slice(5)}</td><td>{h.startEst&&<span className="mut">≈</span>}{fmt(h.start)}</td><td style={{color:"var(--bb)"}}>{fmt(h.bb)}</td><td style={{color:"var(--rb)"}}>{fmt(h.rb)}</td><td style={{color:h.diff==null?undefined:(h.diff>=0?"var(--good)":"var(--bad)"),fontWeight:700}}>{h.diff==null?"–":(h.diff>0?"+":"")+fmt(h.diff)}</td><td>{h.rbP?"1/"+fmt(h.rbP,1):"–"}</td>
              <td style={{textAlign:"left",whiteSpace:"normal",fontFamily:"inherit"}}>
                <span onClick={()=>setEditDate(editDate===h.date?null:h.date)} style={{cursor:"pointer"}}>
                  {h.est?<span className="pill on" style={{cursor:"pointer"}}>{h.est}</span>:null}
                  {h.memo?<span className="pill" style={{cursor:"pointer"}}>{h.memo}</span>:null}
                  {!h.est&&!h.memo?<span className="mut">＋記録</span>:null}
                </span>
                {editDate===h.date&&(
                  <div style={{marginTop:6}}>
                    <div>{["推定6","推定5","推定4","中間","低設定"].map(v=>(
                      <span key={v} className={"pill"+(h.est===v?" on":"")} onClick={()=>setMeta(h,{est:h.est===v?null:v})}>{v}</span>
                    ))}</div>
                    <div>{["据え置き","リセット","前日★","打った"].map(v=>(
                      <span key={v} className={"pill"+((h.memo||"").includes(v)?" on":"")} onClick={()=>toggleMemo(h,v)}>{v}</span>
                    ))}</div>
                  </div>
                )}
              </td></tr>
            ))}</tbody>
          </table></div>
        </div>
      )}
    </div>
  );
}

/* ---------- aggregate ---------- */
function AggPage({db,stores,models}){
  const [f,setF]=useState({store:"",model:"",date:""});
  const [th56,setTh56]=useState("250");
  const [minS,setMinS]=useState("2500");
  const [thRb,setThRb]=useState("30");
  const [mxMonth,setMxMonth]=useState("");
  const [thDama,setThDama]=useState("4000");
  const pool=db.records.filter(r=>(!f.store||r.store===f.store)&&(!f.model||r.model===f.model)).map(withDerived);
  const thV=parseFloat(th56)||250, minV=parseFloat(minS)||0, rbV=parseFloat(thRb)||30, damaV=parseFloat(thDama)||0;
  const isHotR=r=>hotCheck(r,thV,minV,rbV,damaV)!=null;
  const isWarmR=r=>warmCheck(r,thV,minV,rbV,damaV)!=null;
  const cands=pool.filter(r=>isHotR(r)||isWarmR(r)).sort((a,b)=>{
    if(a.rbP!=null&&b.rbP!=null) return a.rbP-b.rbP;
    if(a.rbP!=null) return -1; if(b.rbP!=null) return 1;
    if((a.maxDama||0)!==(b.maxDama||0)) return (b.maxDama||0)-(a.maxDama||0);
    return (b.rb||0)-(a.rb||0);
  }).slice(0,50);
  const mxDais=[...new Set(pool.map(r=>r.dai))].sort((a,b)=>a-b);
  const allMxDates=[...new Set(pool.map(r=>r.date))].sort();
  const mxMonths=[...new Set(allMxDates.map(d=>d.slice(0,7)))].sort();
  const curMonth=(mxMonth&&mxMonths.includes(mxMonth))?mxMonth:(mxMonths.length?mxMonths[mxMonths.length-1]:"");
  const mxDates=allMxDates.filter(d=>d.slice(0,7)===curMonth);
  const mxCell={}; pool.forEach(r=>{mxCell[r.date+"|"+r.dai]=r;});
  // 狙い台予測: 直近日のデータから翌日の候補をスコアリング
  const baseDate=allMxDates.length?(f.date||allMxDates[allMxDates.length-1]):null;
  const prevRecs=baseDate?pool.filter(r=>r.date===baseDate):[];
  const histHot={}; pool.forEach(r=>{ if(isHotR(r)) histHot[r.dai]=(histHot[r.dai]||0)+1; else if(isWarmR(r)) histHot[r.dai]=(histHot[r.dai]||0)+0.5; });
  const hotPrev=new Set(prevRecs.filter(isHotR).map(r=>r.dai));
  const picks=prevRecs.map(r=>{
    let score=0; const why=[];
    if(r.rbP!=null){
      if(r.rbP>=1000){score+=2;why.push("前日バケ4桁 1/"+fmt(r.rbP,0));}
      else if(r.rbP>=500){score+=1;why.push("前日バケ500超 1/"+fmt(r.rbP,0));}
      else if(r.rbP>=300&&r.rbP<400){score-=2;why.push("バケ300台(入りにくい)");}
    }
    const h=histHot[r.dai]||0;
    if(h>=2){score+=2;why.push("★実績"+h+"回");} else if(h===1){score+=1;why.push("★実績1回");}
    if(hotPrev.has(r.dai-1)||hotPrev.has(r.dai+1)){score+=1;why.push("前日★の隣");}
    if(hotPrev.has(r.dai)){why.push("前日★");}
    return {dai:r.dai,rbP:r.rbP,score,why};
  }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,15);
  // by date
  const byDate={};
  pool.forEach(r=>{ (byDate[r.date]=byDate[r.date]||[]).push(r); });
  const dateRows=Object.keys(byDate).sort().map(d=>{
    const rs=byDate[d];
    const S=rs.reduce((a,r)=>a+(r.start||0),0), B=rs.reduce((a,r)=>a+(r.bb||0),0), R=rs.reduce((a,r)=>a+(r.rb||0),0), T=rs.reduce((a,r)=>a+(r.total||0),0);
    return {date:d,n:rs.length,S,B,R,T,g:S&&T?S/T:null,rbG:S&&R?S/R:null,hot:rs.filter(r=>hotCheck(r,thV,minV,rbV)!=null).length};
  });
  // by 末尾
  const byTail={};
  pool.forEach(r=>{ const t=r.dai%10; (byTail[t]=byTail[t]||[]).push(r); });
  const tailRows=Object.keys(byTail).map(Number).sort((a,b)=>a-b).map(t=>{
    const rs=byTail[t];
    const S=rs.reduce((a,r)=>a+(r.start||0),0), T=rs.reduce((a,r)=>a+(r.total||0),0);
    return {t,n:rs.length,g:S&&T?S/T:null,avgT:rs.length?T/rs.length:null};
  });
  const allS=pool.reduce((a,r)=>a+(r.start||0),0), allB=pool.reduce((a,r)=>a+(r.bb||0),0), allR=pool.reduce((a,r)=>a+(r.rb||0),0), allT=pool.reduce((a,r)=>a+(r.total||0),0);
  return (
    <div className="page">
      <Filters stores={stores} models={models} f={f} setF={setF}/>
      <div className="card">
        <h2>全体サマリー <span className="mut">({pool.length}台日)</span></h2>
        <div className="statgrid">
          <div className="stat"><div className="v">{fmt(allS)}</div><div className="k">総スタート</div></div>
          <div className="stat"><div className="v" style={{color:"var(--bb)"}}>{fmt(allB)}</div><div className="k">総BB</div></div>
          <div className="stat"><div className="v" style={{color:"var(--rb)"}}>{fmt(allR)}</div><div className="k">総RB</div></div>
        </div>
        <div className="note">全体合成確率: <b style={{color:"var(--text)"}}>{allS&&allT?"1/"+fmt(allS/allT,1):"–"}</b>　総当り: <b style={{color:"var(--text)"}}>{fmt(allT)}</b></div>
      </div>
      <div className="card">
        <h2>日別推移（機種平均合成確率）</h2>
        <LineChart data={dateRows.map(d=>({x:d.date,y:d.g}))} yLabel="合成確率 1/x" invertGood/>
        <div className="scrollx" style={{marginTop:6}}><table className="dt">
          <thead><tr><th>日付</th><th>台数</th><th>総S</th><th>BB</th><th>RB</th><th>バケ確率</th><th>合成</th><th>★候補</th></tr></thead>
          <tbody>{dateRows.map((d,i)=>(
            <tr key={i}><td>{d.date.slice(5)}</td><td>{d.n}</td><td>{fmt(d.S)}</td><td style={{color:"var(--bb)"}}>{fmt(d.B)}</td><td style={{color:"var(--rb)"}}>{fmt(d.R)}</td><td>{d.rbG?"1/"+fmt(d.rbG,1):"–"}</td><td>{d.g?"1/"+fmt(d.g,1):"–"}</td><td style={{color:"var(--good)"}}>{d.hot||0}</td></tr>
          ))}</tbody>
        </table></div>
      </div>
      <div className="card">
        <h2>設定5・6候補（バケ確率チェック）</h2>
        <div className="row2">
          <div><label className="fl">バケ確率 1/x 以内</label>
            <input type="text" inputMode="numeric" value={th56} onChange={e=>setTh56(e.target.value)}/></div>
          <div><label className="fl">最低累計スタート</label>
            <input type="text" inputMode="numeric" value={minS} onChange={e=>setMinS(e.target.value)}/></div>
          <div><label className="fl">RB回数(回転数なし店)</label>
            <input type="text" inputMode="numeric" value={thRb} onChange={e=>setThRb(e.target.value)}/></div>
        </div>
        <label className="fl">最大持ち玉しきい値（AT機・モンキーターン等）</label>
        <input type="text" inputMode="numeric" value={thDama} onChange={e=>setThDama(e.target.value)}/>
        <div className="scrollx" style={{marginTop:8}}><table className="dt">
          <thead><tr><th>台番号</th><th>日付</th><th>店舗</th><th>累計S</th><th>RB</th><th>バケ確率</th><th>合成</th></tr></thead>
          <tbody>{cands.map((r,i)=>(
            <tr key={i} className={isHotR(r)?"hot":""}><td><span className="daichip">{r.dai}</span><span className="star56" style={isHotR(r)?null:{color:"var(--accent)"}}>{isHotR(r)?"★":"△"}</span></td><td className="mut">{r.date.slice(5)}</td><td className="mut">{r.store}</td><td>{fmt(r.start)}</td><td style={{color:"var(--rb)",fontWeight:r.rbP==null?700:400}}>{fmt(r.rb)}</td><td style={{color:"var(--good)",fontWeight:700}}>{r.rbP!=null?"1/"+fmt(r.rbP,1):((r.rb==null||r.rb===0)&&r.maxDama!=null?fmt(r.maxDama)+"枚":"RB"+fmt(r.rb)+"回")}</td><td>{r.gouseiD?"1/"+fmt(r.gouseiD,1):"–"}</td></tr>
          ))}</tbody>
        </table></div>
        {!cands.length&&<div className="note">条件を満たす台はありません</div>}
        <div className="note" style={{marginTop:6}}>判定は2系統: ①バケ確率(累計S÷RB)がしきい値以内(回転数公開店)、②回転数非公開の店(ベルシティ等)はRB回数がしきい値以上、③AT機(バケ確率が出ない機種)は最大持ち玉がしきい値以上。①をバケ確率順→②をRB回数順に表示。マイジャグVの理論値: 設定6=1/229、設定5=1/255、設定1=1/378。</div>
      </div>
      <div className="card">
        <h2>★カレンダー（日付 × 台番号）</h2>
        {!f.store?<div className="note">店舗（と必要なら機種）を選択すると表示されます。台番号は店舗内でのみ一意のためです。</div>:(
          <React.Fragment>
            <div style={{marginBottom:8}}>{mxMonths.map(m=>(
              <span key={m} className={"pill"+(m===curMonth?" on":"")} onClick={()=>setMxMonth(m)}>{m.replace("-","/")}</span>
            ))}</div>
            <div className="scrollx"><table className="mx">
              <thead><tr><th className="dcol">日付</th>{mxDais.map(d=><th key={d}>{d}</th>)}</tr></thead>
              <tbody>{mxDates.map(dt=>(
                <tr key={dt}><td className="dcol">{dt.slice(5)}</td>{mxDais.map(d=>{
                  const r=mxCell[dt+"|"+d];
                  if(!r) return <td key={d}></td>;
                  const hot=isHotR(r), warm=!hot&&isWarmR(r);
                  const tip=`台${d} ${dt}  RB:${r.rb!=null?r.rb:"-"} ${r.rbP?"バケ1/"+r.rbP.toFixed(1):""} S:${r.start!=null?r.start:"-"}`;
                  return <td key={d} className={hot?"hotc":"dot"} style={warm?{color:"var(--accent)",fontWeight:700}:null} title={tip}>{hot?"★":(warm?"△":"·")}</td>;
                })}</tr>
              ))}</tbody>
            </table></div>
            <div className="note" style={{marginTop:6}}>★＝バケ確率1/{th56}以内(累計{minS}G以上)、回転数なしの店はRB{thRb}回以上　△＝惜しい(G数不足だがバケ優秀/わずかに超過、AT機は出玉が基準の75%以上)　·＝データあり(基準外)　空欄＝データなし。しきい値は上の「設定5・6候補」欄と連動。横スクロールで全台確認できます。</div>
          </React.Fragment>
        )}
      </div>
      <div className="card">
        <h2>狙い台予測（{baseDate?baseDate.slice(5)+" のデータ → 翌日":"–"}）</h2>
        {!f.store?<div className="note">店舗を選択すると表示されます。</div>:(
          <React.Fragment>
            {picks.length?(
              <div className="scrollx"><table className="dt">
                <thead><tr><th>台番号</th><th>点</th><th>前日バケ</th><th style={{textAlign:"left"}}>根拠</th></tr></thead>
                <tbody>{picks.map((x,i)=>(
                  <tr key={i}><td><span className="daichip">{x.dai}</span></td><td style={{color:"var(--good)",fontWeight:700}}>{x.score}</td><td>{x.rbP?"1/"+fmt(x.rbP,0):"–"}</td><td style={{textAlign:"left",fontFamily:"inherit",whiteSpace:"normal"}}>{x.why.map((w,j)=><span key={j} className="pill" style={{cursor:"default",margin:"0 4px 2px 0"}}>{w}</span>)}</td></tr>
                ))}</tbody>
              </table></div>
            ):<div className="note">条件を満たす台がありません（当日のデータを取り込むと翌日の候補が出ます）</div>}
            <div className="note" style={{marginTop:6}}>採点ルール: 前日バケ1/1000以上 +2、1/500以上 +1、1/300台 −2、過去★実績 +1〜2、前日★台の隣 +1。日付フィルタで基準日を変えられます（過去日の答え合わせ用）。</div>
          </React.Fragment>
        )}
      </div>
      <div className="card">
        <h2>末尾別集計</h2>
        <div className="scrollx"><table className="dt">
          <thead><tr><th>末尾</th><th>台日数</th><th>平均合成</th><th>平均当り回数</th></tr></thead>
          <tbody>{tailRows.map((t,i)=>(
            <tr key={i}><td><span className="daichip">{t.t}</span></td><td>{t.n}</td><td>{t.g?"1/"+fmt(t.g,1):"–"}</td><td>{fmt(t.avgT,1)}</td></tr>
          ))}</tbody>
        </table></div>
        <div className="note" style={{marginTop:6}}>末尾＝台番号の下1桁。特定日(ゾロ目・末尾イベント等)の傾向確認用。</div>
      </div>
    </div>
  );
}

function HitPage({db,setDb,stores,models}){

  const profile=guessProfile(model);

  useEffect(()=>{ localStorage.setItem("hit_lastModel",model); },[model]);
  useEffect(()=>{ localStorage.setItem("hit_lastDate",date); },[date]);
  useEffect(()=>{ localStorage.setItem("hit_lastDai",dai); },[dai]);
  const [g,setG]=useState("");
  const [trig,setTrig]=useState("単独");

  const addHit=(type)=>{
    if(!key){ alert("店舗・日付・台番号を入力してください"); return; }

    setG("");
  };

  // 小役カウンター

    {k:"cherry",label:"チェリー",color:"#ef4444",th:[["1",38.1],["6",35.1]]},
    {k:"bell",label:"ベル",color:"#eab308",th:null},
    {k:"other",label:sess.otherLabel||"その他",color:"#38bdf8",th:null},

  const cnt=sess.counts||{};

    if(d>0){ setFlash(f=>({...f,[k]:true})); setTimeout(()=>setFlash(f=>({...f,[k]:false})),260); } };
  // stats

  const totalG=(parseInt(endG)||lastG)-startG;

  const soloRB=list.filter(x=>x.type==="RB"&&x.trig==="単独").length;
  const chRB=list.filter(x=>x.type==="RB"&&x.trig==="チェリー").length;
  const soloBB=list.filter(x=>x.type==="BB"&&x.trig==="単独").length;
  const P=(n)=>n>0&&totalG>0?totalG/n:null;

        {!profile&&<div className="note" style={{marginTop:4}}>未対応機種名です。対応: {Object.keys(MACHINE_PROFILES).join("・")}</div>}
        <div className="row2">
          <div><label className="fl">日付</label><input type="date" value={date} onChange={e=>setDate(e.target.value)}/></div>
          <div><label className="fl">打ち出し開始G（途中参加なら入力）</label>
            <input type="text" inputMode="numeric" value={sess.startG||""} onChange={e=>save({startG:parseInt(e.target.value)||0})} placeholder="0"/></div>
        </div>
      </div>
      {key&&(
      <React.Fragment>
        <div className="card">
          <h2>小役カウンター</h2>
          <div className="kgrid">{KOYAKU.map(o=>{

/* ---------- 出目(リールコード)記録 ---------- */
function ReelPage({db,setDb,stores,models}){
  const today=ymdLocal(new Date());
  const [store,setStore]=useState(stores[0]||"");
  const [date,setDate]=useState(today);
  const [mode,setMode]=useState("night"); // night=コード入力 / morning=変化チェック
  const [editing,setEditing]=useState(false);
  const reels=db.reels||{};
  const reelHidden=db.reelHidden||{};
  const hidden=new Set(reelHidden[store]||[]);
  const toggleHidden=d=>{
    setDb(prev=>{ const rh={...(prev.reelHidden||{})}; const cur=new Set(rh[store]||[]);
      if(cur.has(d)) cur.delete(d); else cur.add(d);
      rh[store]=[...cur]; return {...prev,reelHidden:rh}; });
  };
  const K=(dt,d)=>store+"|"+dt+"|"+d;
  const prevDate=(()=>{ const x=new Date(date+"T00:00:00"); x.setDate(x.getDate()-1); return ymdLocal(x); })();
  // 台番号候補: 記録済みの台 + その店の実績台
  const daisFromRec=[...new Set(db.records.filter(r=>r.store===store).map(r=>r.dai))];
  const daisFromReel=Object.keys(reels).filter(k=>k.startsWith(store+"|")).map(k=>parseInt(k.split("|")[2]));
  const dais=[...new Set([...daisFromRec,...daisFromReel])].filter(d=>!hidden.has(d)).sort((a,b)=>a-b);
  const setCell=(dt,d,patch)=>{
    setDb(prev=>{ const rl={...(prev.reels||{})}; const k=K(dt,d); rl[k]={...(rl[k]||{}),...patch}; 
      if(!rl[k].code&&!rl[k].st) delete rl[k];
      return {...prev,reels:rl}; });
  };
  const cycle=d=>{ const cur=(reels[K(date,d)]||{}).st||null;
    const order={null:"chg",chg:"gak",gak:"unk",unk:null};
    setCell(date,d,{st:order[cur]}); };
  const allUnknown=()=>{ if(!confirm(date+" の全台を「不明」にしますか?")) return;
    setDb(prev=>{ const rl={...(prev.reels||{})}; dais.forEach(d=>{ const k=K(date,d); rl[k]={...(rl[k]||{}),st:"unk"}; }); return {...prev,reels:rl}; }); };
  const clearAll=()=>{ if(!confirm(date+" のチェックをすべて解除しますか?(コードは残ります)")) return;
    setDb(prev=>{ const rl={...(prev.reels||{})}; dais.forEach(d=>{ const k=K(date,d); if(rl[k]){ const o={...rl[k]}; delete o.st; if(o.code) rl[k]=o; else delete rl[k]; } }); return {...prev,reels:rl}; }); };
  const chgCount=dais.filter(d=>(reels[K(date,d)]||{}).st==="chg").length;
  const gakCount=dais.filter(d=>(reels[K(date,d)]||{}).st==="gak").length;
  const unkCount=dais.filter(d=>(reels[K(date,d)]||{}).st==="unk").length;
  const keepCount=dais.length-chgCount-gakCount-unkCount;
  return (
    <div className="page">
      <div className="card">
        <div className="row2">
          <div><label className="fl">店舗</label>
            <select value={store} onChange={e=>setStore(e.target.value)}><option value="">選択</option>{stores.map(x=><option key={x}>{x}</option>)}</select></div>
          <div><label className="fl">日付</label>
            <input type="date" value={date} onChange={e=>setDate(e.target.value)}/></div>
        </div>
        <div style={{marginTop:8}}>
          <span className={"pill"+(mode==="night"?" on":"")} onClick={()=>setMode("night")}>閉店前：コード入力</span>
          <span className={"pill"+(mode==="morning"?" on":"")} onClick={()=>setMode("morning")}>翌朝：変化チェック</span>
          <span className={"pill"+(editing?" on":"")} style={editing?{background:"var(--bb)",borderColor:"var(--bb)",color:"#2a0d0d"}:null} onClick={()=>setEditing(e=>!e)}>{editing?"編集終了":"台を編集"}</span>
        </div>
        {editing&&<div className="note" style={{marginTop:6}}>編集モード中：不要な台をタップすると一覧から除外されます（データは消えません、いつでも戻せます）。</div>}
        {editing&&hidden.size>0&&<div className="note" style={{marginTop:4}}>除外中: {[...hidden].sort((a,b)=>a-b).join("・")} <span style={{color:"var(--accent)",cursor:"pointer"}} onClick={()=>setDb(prev=>({...prev,reelHidden:{...(prev.reelHidden||{}),[store]:[]}}))}>全部戻す</span></div>}
      </div>
      {!store?<div className="card"><div className="note">店舗を選択してください。台番号は取り込み済みデータから自動で並びます。</div></div>:(
      <div className="card">
        {mode==="night"?(
          <React.Fragment>
            <h2>{date.slice(5)} 閉店前のリールコード</h2>
            <div className="note" style={{marginBottom:8}}>各台をタップして3桁（例: 220）を入力。翌朝はこの数字と見比べます。</div>
            <div className="rgrid">{dais.map(d=>{
              const c=(reels[K(date,d)]||{}).code||"";
              return (
                <div key={d} className={"rcell"+(editing?" editmode":"")} onClick={()=>{
                  if(editing){ toggleHidden(d); return; }
                  const v=prompt("台"+d+" のリールコード（3桁 例:220）",c);
                  if(v!==null) setCell(date,d,{code:v.trim().replace(/[^\d]/g,"").slice(0,3)||null});
                }}>
                  {editing&&<span className="rmx">✕</span>}
                  <div className="no">{d}</div>
                  <div className={"cd"+(c?"":" empty")}>{c||"–––"}</div>
                </div>
              );
            })}</div>
          </React.Fragment>
        ):(
          <React.Fragment>
            <h2>{date.slice(5)} 朝の出目チェック</h2>
            <div className="note" style={{marginBottom:8}}>表示は{prevDate.slice(5)}のコード。タップで <b>変化→学訓→不明→解除</b> の順に切り替わります。</div>
            <div className="row2" style={{marginBottom:8}}>
              <button className="btn ghost small" onClick={allUnknown}>全台不明にする</button>
              <button className="btn ghost small" onClick={clearAll}>チェック解除</button>
            </div>
            <div className="legend"><span style={{color:"var(--good)"}}>据え置き {keepCount}</span><span style={{color:"var(--bad)"}}>変化 {chgCount}</span><span style={{color:"#f0b429"}}>学訓 {gakCount}</span><span className="mut">不明 {unkCount}</span></div>
            <div className="rgrid">{dais.map(d=>{
              const st=(reels[K(date,d)]||{}).st||null;
              const pc=(reels[K(prevDate,d)]||{}).code||"";
              return (
                <div key={d} className={"rcell "+(editing?"editmode":(st==="chg"?"chg":(st==="gak"?"gak":(st==="unk"?"unk":(pc?"keep":"")))))} onClick={()=>{ if(editing){ toggleHidden(d); return; } cycle(d); }}>
                  {editing&&<span className="rmx">✕</span>}
                  <div className="no">{d}</div>
                  <div className={"cd"+(pc?"":" empty")}>{pc||"–––"}</div>
                  <div className="tag">{editing?"":(st==="chg"?"変化":(st==="gak"?"学訓":(st==="unk"?"不明":(pc?"据え置き":""))))}</div>
                </div>
              );
            })}</div>
            <div className="note" style={{marginTop:8}}>据え置き＝出目一致・未タップ（ガックン未確認）。学訓＝出目一致だがガックンで店側の操作を確認。変化＝出目自体が違う。前日コードが未記録の台は「–––」（判定なし）。</div>
          </React.Fragment>
        )}
      </div>)}
    </div>
  );
}
/* ---------- ブドウ計算機 ---------- */
function BudouCalc(){
  const [G,setG]=useState(""),[bb,setBb]=useState(""),[rb,setRb]=useState(""),[diff,setDiff]=useState("");
  const [cherryOn,setCherryOn]=useState(false);
  const g=parseFloat(G),b=parseFloat(bb)||0,r=parseFloat(rb)||0,d=parseFloat(String(diff).replace(/[−ー―]/g,"-"));
  const res=(g>0&&!isNaN(d))?calcBudou({G:g,bb:b,rb:r,diff:d,cherryOn}):null;
  const rbP=(g>0&&r>0)?g/r:null, gou=(g>0&&(b+r)>0)?g/(b+r):null;
  return (
    <div className="card">
      <h2>ブドウ逆算（マイジャグV）</h2>
      <div className="row2">
        <div><label className="fl">総回転(G)</label><input type="text" inputMode="numeric" value={G} onChange={e=>setG(e.target.value)} placeholder="6502"/></div>
        <div><label className="fl">差枚(マイナスは -)</label><input type="text" inputMode="text" value={diff} onChange={e=>setDiff(e.target.value)} placeholder="-500"/></div>
      </div>
      <div className="row2">
        <div><label className="fl">BIG</label><input type="text" inputMode="numeric" value={bb} onChange={e=>setBb(e.target.value)} placeholder="26"/></div>
        <div><label className="fl">REG</label><input type="text" inputMode="numeric" value={rb} onChange={e=>setRb(e.target.value)} placeholder="26"/></div>
      </div>
      <label className="fl">チェリー狙い</label>
      <div>
        <span className={"pill"+(!cherryOn?" on":"")} onClick={()=>setCherryOn(false)}>OFF（適当押し）</span>
        <span className={"pill"+(cherryOn?" on":"")} onClick={()=>setCherryOn(true)}>ON（チェリー狙い）</span>
      </div>
      {res?(
        <div style={{marginTop:10}}>
          <div className="statgrid">
            <div className="stat"><div className="v" style={{color:"var(--good)"}}>{"1/"+fmt(res.prob,2)}</div><div className="k">推定ブドウ確率</div></div>
            <div className="stat"><div className="v">{fmt(res.budou)}</div><div className="k">推定ブドウ回数</div></div>
            <div className="stat"><div className="v" style={{color:res.nearest>=5?"var(--good)":undefined}}>{"設定"+res.nearest}</div><div className="k">最も近い設定</div></div>
          </div>
          <div className="scrollx"><table className="dt">
            <thead><tr><th>設定</th><th>理論ブドウ</th><th>差</th></tr></thead>
            <tbody>{res.table.map(t=>(
              <tr key={t[0]} className={t[0]===res.nearest?"hot":""}><td>設定{t[0]}</td><td>{"1/"+t[1].toFixed(2)}</td><td style={{color:Math.abs(t[1]-res.prob)<0.06?"var(--good)":undefined}}>{(res.prob-t[1]>0?"+":"")+fmt(res.prob-t[1],2)}</td></tr>
            ))}</tbody>
          </table></div>
          <div className="note" style={{marginTop:6}}>参考: バケ確率 {rbP?"1/"+fmt(rbP,1):"–"} ／ 合成 {gou?"1/"+fmt(gou,1):"–"}</div>
        </div>
      ):<div className="note" style={{marginTop:10}}>総回転と差枚を入力すると計算します。差枚は負けている場合、半角のマイナス（-500）で入力してください。</div>}
      <div className="note" style={{marginTop:8}}>差枚はスランプグラフの終値でOK（おおよそで可）。前任者の打ち方（ベル・ピエロの取得、ブドウ抜きの有無）で誤差が出ます。理論値: 設定1=1/5.98 … 設定6=1/5.65。</div>
    </div>
  );
}
/* ---------- tools ---------- */
function ToolPage({db,setDb}){
  const fileRef=useRef();
  const exportCSV=()=>{
    const head=["store","model","date","dai","start","bb","rb","bonus","gousei","maxDama","prevStart","est","memo"];
    const esc=v=>{const t=String(v??"");return /[",]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t;};
    const lines=[head.join(",")].concat(db.records.map(r=>head.map(k=>esc(r[k])).join(",")));
    const blob=new Blob(["\uFEFF"+lines.join("\n")],{type:"text/csv"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="slot_data.csv";a.click();
  };
  const exportJSON=()=>{
    const blob=new Blob([JSON.stringify(db)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="slot_data_backup.json";a.click();
  };
  const importCSV=e=>{
    const file=e.target.files[0]; if(!file) return;
    const rd=new FileReader();
    rd.onload=()=>{ try{
      const text=String(rd.result).replace(/^\uFEFF/,"");
      const lines=text.split(/\r?\n/).filter(l=>l.trim());
      if(lines.length<2) throw "データ行がありません";
      const unq=c=>c.replace(/^"|"$/g,"").trim();
      const head=lines[0].split(",").map(c=>unq(c).toLowerCase());
      const idx=k=>head.indexOf(k);
      const iS=idx("store"),iM=idx("model"),iD=idx("date"),iDai=idx("dai");
      if(iS<0||iM<0||iD<0||iDai<0) throw "ヘッダーに store, model, date, dai が必要です（CSV出力と同じ形式）";
      const numCols=["start","bb","rb","bonus","gousei","maxdama","prevstart"];
      const keyName={maxdama:"maxDama",prevstart:"prevStart"};
      const recs=[];
      for(let i=1;i<lines.length;i++){
        const c=lines[i].split(",").map(unq);
        const store=c[iS],model=c[iM];
        let date=normDate(c[iD]);
        const dai=parseInt(String(c[iDai]).replace(/[^\d]/g,""));
        if(!store||!model||!date||isNaN(dai)) continue;
        const r={store,model,date,dai};
        numCols.forEach(k=>{ const j=idx(k); if(j>=0){ const v=num(c[j]); if(v!=null) r[keyName[k]||k]=v; } });
        ["est","memo"].forEach(k=>{ const j=idx(k); if(j>=0&&c[j]) r[k]=c[j]; });
        recs.push(r);
      }
      if(!recs.length) throw "有効な行がありませんでした（date列がYYYY-MM-DD形式か、store/model/daiが空でないか確認してください）";
      setDb(prev=>{ const key=r=>`${r.store}|${r.model}|${r.date}|${r.dai}`; const m=new Map(prev.records.map(r=>[key(r),r])); recs.forEach(r=>m.set(key(r),r)); return {records:[...m.values()]}; });
      alert(recs.length+"件を読み込みました（マージ）");
    }catch(err){ alert("CSV読み込み失敗: "+err); } };
    rd.readAsText(file);
    e.target.value="";
  };
  const importJSON=e=>{
    const file=e.target.files[0]; if(!file) return;
    const rd=new FileReader();
    rd.onload=()=>{ try{ const d=JSON.parse(rd.result); if(!Array.isArray(d.records)) throw 0;
      setDb(prev=>{ const key=r=>`${r.store}|${r.model}|${r.date}|${r.dai}`; const m=new Map(prev.records.map(r=>[key(r),r])); d.records.forEach(r=>m.set(key(r),r)); return {records:[...m.values()]}; });
      alert("読み込みました"); }catch(err){ alert("読み込み失敗: 形式が不正です"); } };
    rd.readAsText(file);
  };
  const wipe=()=>{ if(confirm("全データを削除しますか? この操作は取り消せません")) setDb({records:[]}); };
  return (
    <div className="page">
      <BudouCalc/>
      <div className="card">
        <h2>バックアップ / エクスポート</h2>
        <div className="row2">
          <button className="btn ghost" onClick={exportCSV}>CSV出力</button>
          <button className="btn ghost" onClick={exportJSON}>JSONバックアップ</button>
        </div>
        <label className="fl">バックアップJSONを復元（マージ）</label>
        <input type="file" accept=".json" ref={fileRef} onChange={importJSON} style={{color:"var(--sub)",fontSize:12}}/>
        <label className="fl">CSVを読み込み（マージ / CSV出力と同じ列形式）</label>
        <input type="file" accept=".csv,text/csv" onChange={importCSV} style={{color:"var(--sub)",fontSize:12}}/>
      </div>
      <div className="card">
        <h2>データ管理</h2>
        <div className="note" style={{marginBottom:8}}>保存件数: {db.records.length}件 / LocalStorage使用のため同一ブラウザ内でのみ保持されます。機種変更前はJSONバックアップを推奨。</div>
        <button className="btn danger" onClick={wipe}>全データ削除</button>
      </div>
      <div className="card">
        <h2>注意事項</h2>
        <div className="note">台データオンラインの閲覧規約の範囲内でご利用ください。本アプリは表示中ページの手動取り込み（閲覧の補助）を想定しており、自動巡回・大量取得は行いません。</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
